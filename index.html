/* ===== Visual refresh: Forest fantasy UI ===== */
:root{
 --bg:#edf5e9;--fg:#18352b;--card:#fffdf6;--ac:#267653;--bd:#c8ddca;--bad:#b94742;
 --gold:#e7ae43;--ink:#173c31;--soft:#e1efdf;
}
body{
 background:
  radial-gradient(ellipse at 8% 5%,rgba(255,255,255,.95),transparent 34%),
  radial-gradient(ellipse at 92% 18%,rgba(202,231,199,.7),transparent 30%),
  linear-gradient(145deg,#edf5e9,#f8f1dc 70%,#e6f0df);
 color:var(--fg);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;
}
#app{max-width:760px;padding:clamp(12px,3vw,22px);padding-bottom:max(18px,env(safe-area-inset-bottom))}

select{font:inherit;padding:9px;border-radius:10px;background:#fff;color:#244638;border:1px solid #b9d2bc;max-width:58%;min-height:42px}
.g{color:#267653;font-weight:800}.r{color:#b94742;font-weight:800}
.chips button{margin:4px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px;margin:10px 0}

 animation:homeOrb 8s ease-in-out infinite alternate;
}
.home-card:before{width:190px;height:190px;left:-78px;top:-72px;background:rgba(255,191,215,.35)}
.home-card:after{width:220px;height:220px;right:-100px;bottom:-110px;background:rgba(177,220,255,.34);animation-delay:-3s}

.home-float.f3{left:28%;bottom:0;animation-delay:-2.1s}.home-float.f4{right:27%;bottom:0;animation-delay:-.3s}

/* ===== Tactile button feedback: ripple, pop and pastel sparkles ===== */
button{
 position:relative;isolation:isolate;overflow:hidden;
 transform-origin:center;
}
button.tap-pop{animation:buttonPop .28s cubic-bezier(.2,.85,.25,1)}
button .tap-ripple{
 position:absolute;z-index:0;pointer-events:none;border-radius:50%;
 width:18px;height:18px;left:var(--tap-x,50%);top:var(--tap-y,50%);
 background:radial-gradient(circle,rgba(255,255,255,.8) 0%,rgba(214,177,239,.42) 45%,rgba(255,255,255,0) 72%);
 transform:translate(-50%,-50%) scale(.15);animation:tapRipple .55s ease-out forwards;
}
button .tap-spark{
 position:absolute;z-index:2;pointer-events:none;left:var(--sx);top:var(--sy);
 color:var(--spark-color,#c39add);font-size:var(--ss,13px);line-height:1;
 text-shadow:0 1px 4px rgba(255,255,255,.9);
 animation:tapSpark .62s ease-out forwards;
}
button.go .tap-spark{color:#fff}
button:active:not(:disabled){filter:brightness(1.035) saturate(1.12)}
@keyframes buttonPop{
 0%{transform:scale(1)}
 38%{transform:scale(.965)}
 72%{transform:scale(1.025)}
 100%{transform:scale(1)}
}
@keyframes tapRipple{
 0%{opacity:.9;transform:translate(-50%,-50%) scale(.15)}
 100%{opacity:0;transform:translate(-50%,-50%) scale(8)}
}
@keyframes tapSpark{
 0%{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(0deg)}
 18%{opacity:1}
 100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.25) rotate(100deg)}
}
@media(prefers-reduced-motion:reduce){
 button.tap-pop{animation:none}
 button .tap-ripple,button .tap-spark{display:none}
}

async function downloadReportImage(){
 const target=$('#reportCapture'),status=$('#reportStatus'),btn=$('#saveReport');
 if(!target)return;
 if(!window.html2canvas){status.textContent='โหลดระบบสร้างรูปภาพไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ต';return;}
 btn.disabled=true;status.textContent='กำลังสร้างรูปภาพ...';
 try{const canvas=await html2canvas(target,{scale:2,backgroundColor:'#fffdfd',useCORS:true});
 const a=document.createElement('a');a.download='Kingdom_Defense_'+(NAME||'student').replace(/[^\u0E00-\u0E7Fa-zA-Z0-9_-]/g,'_')+'.png';a.href=canvas.toDataURL('image/png');a.click();status.textContent='บันทึกรูปภาพเรียบร้อยแล้ว สามารถส่งไฟล์ PNG ให้ครูได้เลย';
 }catch(e){status.textContent='สร้างรูปภาพไม่สำเร็จ: '+e.message;}btn.disabled=false;
}
function getReportPayload(){
 if(S&&S.res&&S.res.length)RES[K]=S.res.slice();
 const kingdoms=KD.map((d,j)=>{const r=RES[j]||[];return {kingdom:d.k,answered:r.filter(x=>x!==undefined).length,correct:r.filter(Boolean).length,stars:BEST[j]||0};});
 return {studentName:NAME||'ไม่ระบุชื่อ',game:'Kingdom Defense by KRUPOY',playedAt:new Date().toISOString(),kingdoms,totalAnswered:kingdoms.reduce((a,x)=>a+x.answered,0),totalCorrect:kingdoms.reduce((a,x)=>a+x.correct,0),totalStars:kingdoms.reduce((a,x)=>a+x.stars,0)};
}
function sendReportToSheet(){
 const status=$('#reportStatus'),btn=$('#sendReport'),payload=getReportPayload();
 if(!window.google||!google.script||!google.script.run){status.textContent='การส่งคะแนนต้องเปิดเกมผ่านลิงก์ Web App ของ Google Apps Script';return;}
 btn.disabled=true;status.textContent='กำลังส่งคะแนน...';
 google.script.run.withSuccessHandler(res=>{status.textContent=(res&&res.message)||'บันทึกคะแนนเรียบร้อยแล้ว';btn.disabled=false;})

// Pastel tap feedback for mouse, touch and keyboard activation.
function buttonTapFX(button, clientX, clientY){
 if(!button || button.disabled)return;
 const rect=button.getBoundingClientRect();
 const x=Number.isFinite(clientX)?clientX-rect.left:rect.width/2;
 const y=Number.isFinite(clientY)?clientY-rect.top:rect.height/2;
 const ripple=document.createElement('span');
 ripple.className='tap-ripple';
 ripple.style.setProperty('--tap-x',x+'px');
 ripple.style.setProperty('--tap-y',y+'px');
 button.appendChild(ripple);
 ripple.addEventListener('animationend',()=>ripple.remove(),{once:true});

 button.classList.remove('tap-pop');
 void button.offsetWidth;
 button.classList.add('tap-pop');
 button.addEventListener('animationend',e=>{
   if(e.animationName==='buttonPop')button.classList.remove('tap-pop');
 },{once:true});

 const colors=['#e9a6c4','#c39add','#9dcfb8','#f0c879','#9fc3eb'];
 for(let i=0;i<4;i++){
   const spark=document.createElement('span');
   spark.className='tap-spark';
   spark.textContent=i%2?'✧':'✦';
   spark.style.setProperty('--sx',x+'px');
   spark.style.setProperty('--sy',y+'px');
   spark.style.setProperty('--dx',((i-1.5)*17)+'px');
   spark.style.setProperty('--dy',(-15-Math.abs(i-1.5)*8)+'px');
   spark.style.setProperty('--ss',(10+(i%2)*5)+'px');
   spark.style.setProperty('--spark-color',colors[i]);
   button.appendChild(spark);
   spark.addEventListener('animationend',()=>spark.remove(),{once:true});
 }
}

 if(!button||button.disabled)return;

}, {passive:true});

 // Keyboard / assistive-technology activation has no preceding pointer event.

   ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-4,-2,2.5,0,Math.PI*2);ctx.arc(4,-2,2.5,0,Math.PI*2);ctx.fill();

  }

  ctx.fillStyle='#e9a0b1';ctx.fillRect(e.x-bw/2,hy,bw,5);

 });
